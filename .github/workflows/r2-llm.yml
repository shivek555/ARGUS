# R2-L (ADR-0011): run the free open-weights intent monitor on a GitHub-hosted runner.
# Manual only. Ollama and the model are installed on GitHub's machine, never on a user's PC.
# No secrets are used; the monitor only ever sees synthetic benchmark data.
# Results (response cache + summary) are committed back to the branch so replay works anywhere.
name: R2 LLM (local open-weights model)

on:
  workflow_dispatch:
    inputs:
      model:
        description: Pre-registered candidate (ADR-0011); phi4-mini is the reserve
        type: choice
        options: ["llama3.2:3b", "qwen2.5:3b", "phi4-mini:3.8b"]
        default: "llama3.2:3b"
      run:
        description: What to run
        type: choice
        options: [smoke, pilot, dev, catalog]
        default: smoke
      shards:
        description: Split the run into this many jobs (resume-safe)
        type: number
        default: 1
      shard:
        description: Which shard this job runs (0-based)
        type: number
        default: 0
      time_cap_min:
        description: Stop before this many minutes (job limit is 6 h)
        type: number
        default: 320

permissions:
  contents: write   # only to commit the response cache + summary back

concurrency:
  group: r2-llm     # one run at a time, so commits never race
  cancel-in-progress: false

env:
  OLLAMA_PIN: "0.40.2"     # released 2026-10-08
  ARGUS_LLM_PROVIDER: ollama
  ARGUS_LLM_MODE: live

jobs:
  monitor:
    runs-on: ubuntu-24.04   # pinned: ubuntu-latest moved to 26.04 (no Python 3.11.9 build)
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            constraints.txt

      - name: Install ARGUS (locked)
        run: python -m pip install -r requirements.txt -c constraints.txt

      - name: Runner specs (recorded with results)
        run: |
          nproc
          free -g
          df -h /

      - name: Install Ollama (pinned)
        run: curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION="$OLLAMA_PIN" sh

      - name: Start Ollama and pull the model
        env:
          MODEL: ${{ inputs.model }}
        run: |
          ollama serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:11434/api/version && break
            sleep 2
          done
          ollama --version
          ollama pull "$MODEL"

      - name: Run the monitor
        env:
          ARGUS_LLM_MODEL: ${{ inputs.model }}
          ARGUS_OLLAMA_VERSION: ${{ env.OLLAMA_PIN }}
          RUN: ${{ inputs.run }}
          SHARDS: ${{ inputs.shards }}
          SHARD: ${{ inputs.shard }}
          CAP: ${{ inputs.time_cap_min }}
        run: python -m argus.eval.r2_local --run "$RUN" --shards "$SHARDS" --shard "$SHARD" --time-cap-min "$CAP"

      - name: Upload results (also kept as an artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2l-results
          path: |
            argus/intent/cache/ollama/
            eval/r2l/
          if-no-files-found: ignore

      - name: Commit results back to the branch
        if: always()
        env:
          RUN: ${{ inputs.run }}
          MODEL: ${{ inputs.model }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add argus/intent/cache/ollama eval/r2l || true
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "r2-llm: $RUN results for $MODEL"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
